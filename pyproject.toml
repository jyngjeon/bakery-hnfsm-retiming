[project]
name = "bakery-hnfsm-retiming"
version = "0.1.0"
description = "Reproduction of Babor et al. (2023) bakery HNFSM scheduling (makespan + OIDT) and Event-Point Retiming extension"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.2.5",
    "pandas>=2.2.3,<3",
    "openpyxl>=3.1",
    "ortools>=9.10",
    "jmetalpy==1.9.0",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bakery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
